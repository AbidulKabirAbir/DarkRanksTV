        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a0f, #030305);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #00d2ff; border-radius: 10px; }
        .header {
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10,10,15,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {

            border-radius: 14px;

            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(0,210,255,0.3);
        }
        .logo-text { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span:first-child { background: linear-gradient(135deg, #fff, #00d2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-text span:last-child { color: #e63946; }
        .logo-badge {
            font-size: 10px;
            padding: 4px 12px;
            background: rgba(0,210,255,0.2);
            border-radius: 40px;
            color: #00d2ff;
            font-weight: 700;
            border: 1px solid rgba(0,210,255,0.3);
            transition: all 0.2s;

        .header-stats { display: flex; gap: 20px; align-items: center; }
        .live-badge { display: flex; align-items: center; gap: 8px; background: rgba(239,68,68,0.2); padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(239,68,68,0.4); font-weight: 600; }
        .live-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: pulse 1.2s infinite; }

        .stat-value { color: #00d2ff; font-weight: 800; font-size: 18px; margin-right: 4px; }
        .time-display { font-family: monospace; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 40px; letter-spacing: 1px; }
        .main-content { display: flex; flex: 1; padding: 24px 32px; gap: 28px; height: calc(100vh - 85px); overflow: hidden; }
        .player-container { flex: 2.2; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .video-wrapper { position: relative; background: #000; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 50px rgba(0,0,0,0.6); aspect-ratio: 16/9; transition: transform 0.2s; }
        .video-wrapper:hover { transform: scale(1.01); }
        #video { width: 100%; height: 100%; object-fit: contain; }
        .channel-info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); padding: 8px 20px; border-radius: 40px; font-weight: 600; font-size: 14px; border-left: 4px solid #00d2ff; z-index: 45; pointer-events: none; }
        .video-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 20px 24px; opacity: 0; transition: opacity 0.3s; z-index: 50; }
        .video-wrapper:hover .video-controls { opacity: 1; }
        .controls-row { display: flex; align-items: center; gap: 18px; }
        .control-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: white; cursor: pointer; transition: 0.2s; }
        .control-btn:hover { background: #00d2ff; transform: scale(1.08); }
        .volume-slider { width: 80px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { width: 14px; height: 14px; background: #00d2ff; border-radius: 50%; appearance: none; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00d2ff, #e63946); width: 0%; border-radius: 2px; }
        .nav-arrows { position: absolute; top: 50%; left: 20px; right: 20px; transform: translateY(-50%); display: flex; justify-content: space-between; pointer-events: none; }
        .nav-arrow { width: 48px; height: 48px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; opacity: 0; transition: 0.2s; }
        .video-wrapper:hover .nav-arrow { opacity: 0.8; }
        .nav-arrow:hover { background: #00d2ff; transform: scale(1.1); opacity: 1; }
        .loading-overlay, .error-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 80; opacity: 0; visibility: hidden; transition: 0.2s; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
        .loading-overlay.active, .error-overlay.active { opacity: 1; visibility: visible; }
        .error-overlay button { margin-top: 16px; background: #00d2ff; border: none; padding: 8px 20px; border-radius: 40px; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .error-overlay button:hover { background: #e63946; color: white; transform: scale(1.02); }
        .spinner-ring { width: 50px; height: 50px; border: 3px solid rgba(0,210,255,0.2); border-top-color: #00d2ff; border-radius: 50%; animation: spin 1s linear infinite; }

        .channel-panel {

            background: rgba(10,12,20,0.98); backdrop-filter: blur(24px); border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1); transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.2,0.9,0.4,1.1); z-index: 90;
            max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .channel-panel.show { transform: translateY(0); }
        .panel-header { padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .close-panel { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; transition: 0.2s; }
        .close-panel:hover { background: rgba(255,255,255,0.1); }
        .source-toggle { padding: 12px 20px; display: flex; gap: 15px; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); }
        .source-btn { padding: 8px 24px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .source-btn.active { background: linear-gradient(135deg, #00d2ff, #e63946); border-color: transparent; box-shadow: 0 4px 12px rgba(0,210,255,0.3); }
        .search-bar { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
        .search-input { width: 100%; padding: 12px 18px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; color: white; font-size: 14px; outline: none; transition: 0.2s; }

        .filter-group { padding: 8px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #00d2ff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .country-search-box { width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; color: white; font-size: 13px; outline: none; margin-bottom: 8px; }
        .country-search-box:focus { border-color: #00d2ff; }
        .country-tabs, .category-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
        .country-tab, .category-tab { padding: 5px 14px; background: rgba(255,255,255,0.05); border: none; border-radius: 40px; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; transition: 0.2s; }
        .country-tab.active, .category-tab.active { background: #00d2ff; color: #fff; box-shadow: 0 2px 8px rgba(0,210,255,0.4); }
        .country-tab:hover:not(.active), .category-tab:hover:not(.active) { background: rgba(0,210,255,0.3); }
        .channels-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; }
        .channel-card { text-align: center; cursor: pointer; padding: 12px 8px; border-radius: 20px; transition: all 0.25s ease; background: rgba(255,255,255,0.02); border: 1px solid transparent; }
        .channel-card:hover { background: rgba(0,210,255,0.15); transform: translateY(-5px); border-color: rgba(0,210,255,0.3); }

            border: 2px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.2s;

            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00d2ff20, #e6394620);
            font-weight: bold;
            font-size: 28px;
            color: #fff;
            text-transform: uppercase;
        }

    </div>
</div>

<div class="main-content">

            </div>

                    <button class="control-btn" id="playPauseBtn"><i class="fas fa-pause"></i></button>
                    <div class="volume-control">
                        <button class="control-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="75">
                    </div>
                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                    <button class="control-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
                </div>
            </div>
            <div class="loading-overlay" id="loadingOverlay"><div class="spinner-ring"></div><div>Loading stream...</div></div>
            <div class="error-overlay" id="errorOverlay">

    </div>
</div>

<button class="toggle-btn" id="channelToggle"><i class="fas fa-th-large"></i></button>

<div class="channel-panel" id="channelPanel">

    <div class="source-toggle" id="sourceToggle">
        <button class="source-btn" data-source="local">📺 Local TVs</button>
        <button class="source-btn" data-source="global">🌍 Global</button>
    </div>
    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search channels by name...">
        <button class="search-clear" id="searchClear" style="display: none;"><i class="fas fa-times-circle"></i></button>
    </div>
    <div class="filter-group" id="countryFilterGroup">
        <div class="filter-label"><i class="fas fa-globe"></i> Country</div>
        <input type="text" id="countrySearchInput" class="country-search-box" placeholder="Search country...">
        <div class="country-tabs" id="countryTabs"></div>
    </div>
    <div class="filter-group">
        <div class="filter-label"><i class="fas fa-tag"></i> Category</div>
        <div class="category-tabs" id="categoryTabs"></div>
    </div>
    <div class="channels-grid" id="channelsGrid"></div>
</div>

<div class="toast" id="toast">Channel changed</div>
<div class="status-banner" id="statusBanner">📡 Local TVs ready (1000+)</div>

    // ==================== 2. GLOBAL IPTV-ORG ====================
    let globalChannels = [];
    async function fetchGlobalChannels() {
        try {
            setStatus('🌍 Fetching global IPTV channels...');
            const [channelsRes, streamsRes, countriesRes] = await Promise.all([
                fetch('https://iptv-org.github.io/api/channels.json'),
                fetch('https://iptv-org.github.io/api/streams.json'),
                fetch('https://iptv-org.github.io/api/countries.json')
            ]);
            if (!channelsRes.ok || !streamsRes.ok) throw new Error('API fetch failed');
            const allChannels = await channelsRes.json();
            const allStreams = await streamsRes.json();
            const countriesData = await countriesRes.json();
            const countryMap = new Map();
            for (const c of countriesData) countryMap.set(c.code, c.name);
            const streamMap = new Map();
            for (const stream of allStreams) {
                if (stream.channel && stream.url && stream.url.startsWith('http')) {
                    if (!streamMap.has(stream.channel)) streamMap.set(stream.channel, []);
                    if (!streamMap.get(stream.channel).includes(stream.url))
                        streamMap.get(stream.channel).push(stream.url);
                }
            }
            const combined = [];
            for (const ch of allChannels) {
                const urls = streamMap.get(ch.id);
                if (!urls || urls.length === 0) continue;
                let category = (ch.categories && ch.categories.length) ? ch.categories[0] : "General";
                let countryName = ch.country ? (countryMap.get(ch.country) || ch.country) : "International";
                combined.push({
                    name: ch.name,
                    logo: ch.logo || '',
                    urls: urls,
                    url: urls[0],
                    category: category,
                    countryName: countryName
                });
            }
            setStatus(`✅ Global: ${combined.length} channels`);
            return combined;
        } catch (err) {
            console.error(err);
            setStatus('❌ Failed to load global channels', true);
            return [];
        }
    }

    function setStatus(msg, isError = false) {

    function getLogoHtml(channel) {
        if (channel.logo && channel.logo.startsWith('http')) {
            return `<img src="${channel.logo}" alt="${channel.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'logo-placeholder\\'>${channel.name.charAt(0).toUpperCase()}</div>';">`;
        } else {
            return `<div class="logo-placeholder">${channel.name.charAt(0).toUpperCase()}</div>`;
        }
    }

    function renderChannels() {
        channelsGrid.innerHTML = '';
        currentDisplayChannels.forEach((ch, idx) => {
            const card = document.createElement('div');
            card.className = `channel-card ${(idx === currentChannelIndex) ? 'active' : ''}`;
            card.setAttribute('data-idx', idx);
            card.innerHTML = `
                <div class="channel-logo">
                    ${getLogoHtml(ch)}
                </div>
                <div class="channel-name">${ch.name}</div>
            `;
            card.onclick = () => { playChannel(idx); };
            channelsGrid.appendChild(card);
        });
    }

    function getFilteredChannels() {
        let result = allChannels;
        if (countrySearchQuery.trim()) {
            const q = countrySearchQuery.toLowerCase();
            result = result.filter(ch => ch.countryName.toLowerCase().includes(q));
        } else if (currentCountry !== "All") {
            result = result.filter(ch => ch.countryName === currentCountry);
        }
        if (currentCategory !== "All") {
            result = result.filter(ch => ch.category === currentCategory);
        }
        if (searchQuery.trim()) {
            const words = searchQuery.toLowerCase().split(/\s+/);
            result = result.filter(ch => words.every(w => ch.name.toLowerCase().includes(w)));
        }
        return result;
    }

    function refreshDisplayChannels() {
        currentDisplayChannels = getFilteredChannels();
        document.getElementById('channelCount').innerText = allChannels.length;
        document.getElementById('totalChannelsLabel').innerText = currentDisplayChannels.length;
        if (currentDisplayChannels.length === 0) {
            channelsGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">📺 No channels match filters</div>';
            return;
        }
        if (currentChannelIndex >= currentDisplayChannels.length) currentChannelIndex = 0;
        renderChannels();
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
        let activeCard = document.querySelector(`.channel-card[data-idx="${currentChannelIndex}"]`);
        if (activeCard) activeCard.classList.add('active');
    }

    function getAllCountries() {
        const set = new Set();
        for (const ch of allChannels) set.add(ch.countryName);
        return Array.from(set).sort();

        let countries = getAllCountries();
        if (countrySearchQuery.trim()) {

            countries = countries.filter(c => c.toLowerCase().includes(q));
        }
        const display = ["All", ...countries];
        countryTabsDiv.innerHTML = '';
        for (const c of display) {
            const btn = document.createElement('button');
            btn.className = `country-tab ${c === currentCountry ? 'active' : ''}`;
            btn.textContent = c;
            btn.onclick = () => {
                currentCountry = c;
                countrySearchInput.value = '';
                countrySearchQuery = '';
                currentCategory = "All";
                searchQuery = '';
                searchInput.value = '';
                searchClear.style.display = 'none';
                renderCountryTabs();
                renderCategoryTabs();
                refreshDisplayChannels();
            };
            countryTabsDiv.appendChild(btn);
        }
    }

    function renderCategoryTabs() {
        let available = allChannels;
        if (countrySearchQuery.trim()) {
            const q = countrySearchQuery.toLowerCase();
            available = available.filter(ch => ch.countryName.toLowerCase().includes(q));
        } else if (currentCountry !== "All") {
            available = available.filter(ch => ch.countryName === currentCountry);
        }
        const cats = new Set();
        for (const ch of available) cats.add(ch.category);
        const catList = ["All", ...Array.from(cats).sort()];
        categoryTabsDiv.innerHTML = '';
        for (const cat of catList) {
            const btn = document.createElement('button');
            btn.className = `category-tab ${cat === currentCategory ? 'active' : ''}`;
            btn.textContent = cat;
            btn.onclick = () => {
                currentCategory = cat;
                renderCategoryTabs();
                refreshDisplayChannels();
            };
            categoryTabsDiv.appendChild(btn);
        }
    }

    function showErrorAndStopAutoSkip() {
        loadingOverlay.classList.remove('active');
        errorOverlay.classList.add('active');
    }

    function playChannel(index) {
        if (!currentDisplayChannels.length) return;
        const channel = currentDisplayChannels[index];
        if (!channel) return;
        currentChannelIndex = index;
        channelInfo.innerHTML = `<i class="fas fa-circle" style="font-size:8px; color:#10b981;"></i> ${channel.name} (${channel.countryName})`;
        loadingOverlay.classList.add('active');
        errorOverlay.classList.remove('active');
        if (hls) hls.destroy();
        const streamUrl = channel.url;
        function setupHls(url) {
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, maxBufferLength: 30, maxMaxBufferLength: 60, startLevel: -1 });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingOverlay.classList.remove('active');
                    video.play().catch(e=>console.log);
                });
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        console.error("HLS fatal error", data);
                        showErrorAndStopAutoSkip();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => loadingOverlay.classList.remove('active'), { once: true });
                video.addEventListener('error', () => showErrorAndStopAutoSkip());
            } else {
                showErrorAndStopAutoSkip();
            }
        }
        setupHls(streamUrl);
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
        let activeCard = document.querySelector(`.channel-card[data-idx="${index}"]`);
        if (activeCard) activeCard.classList.add('active');
        showToast(channel.name);
        channelPanelDiv.classList.remove('show');
        localStorage.setItem('last_channel', JSON.stringify({ source: currentSource, country: currentCountry, category: currentCategory, index }));
    }

    function playNextChannel() { if (!currentDisplayChannels.length) return; let next = (currentChannelIndex + 1) % currentDisplayChannels.length; playChannel(next); }
    function playPreviousChannel() { if (!currentDisplayChannels.length) return; let prev = (currentChannelIndex - 1 + currentDisplayChannels.length) % currentDisplayChannels.length; playChannel(prev); }
    
    prevBtn.addEventListener('click', playPreviousChannel);
    nextBtn.addEventListener('click', playNextChannel);
    manualRetryBtn.addEventListener('click', () => { playChannel(currentChannelIndex); });
    manualSkipBtn.addEventListener('click', () => { playNextChannel(); });
    
    function updateVolumeUI() { let vol = video.muted ? 0 : video.volume; muteBtn.innerHTML = vol === 0 ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; volumeSlider.value = vol * 100; localStorage.setItem('tv_volume', vol * 100); }
    video.addEventListener('volumechange', updateVolumeUI);
    volumeSlider.addEventListener('input', (e) => { video.volume = e.target.value / 100; video.muted = false; updateVolumeUI(); });
    muteBtn.addEventListener('click', () => { video.muted = !video.muted; updateVolumeUI(); });
    function togglePlayPause() { if (video.paused) video.play().catch(e=>console.log); else video.pause(); }
    playPauseBtn.addEventListener('click', togglePlayPause);
    video.addEventListener('play', () => playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>');
    video.addEventListener('pause', () => playPauseBtn.innerHTML = '<i class="fas fa-play"></i>');
    function toggleFullscreen() { if (!document.fullscreenElement) videoWrapper.requestFullscreen(); else document.exitFullscreen(); }
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    video.addEventListener('timeupdate', () => { if (video.duration) progressFill.style.width = (video.currentTime / video.duration) * 100 + '%'; });
    progressBar.addEventListener('click', (e) => { let rect = progressBar.getBoundingClientRect(); let percent = (e.clientX - rect.left) / rect.width; if (video.duration) video.currentTime = percent * video.duration; });
    
    function showToast(msg) { toastDiv.innerText = msg; toastDiv.classList.add('show'); setTimeout(() => toastDiv.classList.remove('show'), 2000); }
    
    searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; searchClear.style.display = searchQuery ? 'block' : 'none'; refreshDisplayChannels(); });
    searchClear.addEventListener('click', () => { searchInput.value = ''; searchQuery = ''; searchClear.style.display = 'none'; refreshDisplayChannels(); });
    countrySearchInput.addEventListener('input', (e) => { countrySearchQuery = e.target.value; currentCountry = "All"; renderCountryTabs(); renderCategoryTabs(); refreshDisplayChannels(); });
    channelToggleBtn.addEventListener('click', () => channelPanelDiv.classList.add('show'));
    closePanelBtn.addEventListener('click', () => channelPanelDiv.classList.remove('show'));
    document.addEventListener('keydown', (e) => {
        const isInput = document.activeElement?.tagName === 'INPUT';
        if (e.code === 'Space' && !isInput) { e.preventDefault(); togglePlayPause(); }
        if (e.key === 'Escape') channelPanelDiv.classList.remove('show');
        if (e.key === 'c' || e.key === 'C') channelPanelDiv.classList.toggle('show');
        if (!isInput) {
            if (e.key === 'ArrowLeft') { e.preventDefault(); playPreviousChannel(); }
            if (e.key === 'ArrowRight') { e.preventDefault(); playNextChannel(); }
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        }
    });
    function showControlsTemporarily() { let ctrl = document.querySelector('.video-controls'); ctrl.style.opacity = '1'; clearTimeout(controlsTimeout); controlsTimeout = setTimeout(() => { if (!video.paused) ctrl.style.opacity = '0'; }, 3000); }
    videoWrapper.addEventListener('mousemove', showControlsTemporarily);
    function updateClock() { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    setInterval(updateClock, 1000); updateClock();
    
    async function setSource(source) {
        currentSource = source;
        document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.source-btn[data-source="${source}"]`).classList.add('active');
        if (source === 'local') {
            allChannels = LOCAL_CHANNELS;
            sourceBadge.innerText = `Local ${LOCAL_CHANNELS.length}`;
            setStatus(`📺 Local TVs: ${LOCAL_CHANNELS.length} channels`);
        } else {
            if (globalChannels.length === 0) {
                globalChannels = await fetchGlobalChannels();
            }
            allChannels = globalChannels;
            sourceBadge.innerText = `Global ${globalChannels.length}`;
            setStatus(`🌍 Global: ${globalChannels.length} channels`);
        }
        currentCountry = "All";
        currentCategory = "All";
        searchQuery = "";
        countrySearchQuery = "";
        searchInput.value = "";
        countrySearchInput.value = "";
        searchClear.style.display = 'none';
        renderCountryTabs();
        renderCategoryTabs();
        refreshDisplayChannels();
        if (currentDisplayChannels.length) playChannel(0);
        localStorage.setItem('last_source', source);
    }
    
    document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', () => setSource(btn.dataset.source));
    });
    
    async function init() {
        allChannels = LOCAL_CHANNELS;
        sourceBadge.innerText = `Local ${LOCAL_CHANNELS.length}`;
        renderCountryTabs();
        renderCategoryTabs();
        refreshDisplayChannels();
        const savedSource = localStorage.getItem('last_source');
        if (savedSource === 'global') {
            await setSource('global');
        } else {
            await setSource('local');
        }
        video.muted = true;
        updateVolumeUI();
        if (currentDisplayChannels.length) playChannel(currentChannelIndex);
        setTimeout(() => { if (video.muted && !video.paused) { video.muted = false; updateVolumeUI(); } }, 2000);
    }
    init();
</script>
</body>
</html>
